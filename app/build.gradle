plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.workbuddy.iptvplayer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.workbuddy.iptvplayer'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // Playback engine: Google Media3 / ExoPlayer (Apache-2.0)
    implementation 'androidx.media3:media3-common:1.9.4'
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.4'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.4'
    implementation 'androidx.media3:media3-ui:1.9.4'

    // Playlist / EPG download (Apache-2.0)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
