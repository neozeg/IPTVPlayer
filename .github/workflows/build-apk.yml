name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null || true
          # Newer cmdline-tools ship the `android` CLI; older ones only sdkmanager.
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/android" sdk install 'platforms;android-36' 'build-tools;36.0.0' --sdk="$ANDROID_HOME" --no-metrics || true
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
