name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Note: avoid android-actions/setup-android - its internal `sdkmanager tools`
      # call fails on current SDK repositories (the legacy `tools` package is gone).
      # ubuntu-latest already ships cmdline-tools, so install the packages directly.
      - name: Set up Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CLI_DIR="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$CLI_DIR/sdkmanager" ]; then
            CLI_DIR="$(dirname "$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -1)")"
          fi
          echo "Using SDK CLI: $CLI_DIR"
          yes | "$CLI_DIR/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$CLI_DIR/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 \
            || "$CLI_DIR/android" sdk install 'platforms;android-36' 'build-tools;36.0.0' \
               --sdk="$SDK" --no-metrics > /dev/null 2>&1 \
            || true
          test -f "$SDK/platforms/android-36/android.jar"
          test -x "$SDK/build-tools/36.0.0/aapt2"
          echo "Android SDK 36 ready"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
